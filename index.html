<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ماینکرفت آنلاین - نسخه وب</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* آسمان ماینکرفتی */
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* پنل اطلاعات بالا */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            border: 2px solid #555;
            pointer-events: none;
        }
        /* نشانگر وسط صفحه (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }
        /* دکمه‌های کنترل لمسی (حرکت، پریدن، کندن) */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
        }
        .btn {
            background: rgba(100, 100, 100, 0.7);
            border: 3px solid #333;
            color: white;
            height: 60px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            background: rgba(150, 150, 150, 0.9);
        }
        #action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            font-size: 16px;
            background: rgba(139, 69, 19, 0.8);
            border: 3px solid #3b220b;
        }
    </style>
</head>
<body>

    <div id="ui">
        امتیاز / بلوک‌های کنده شده: <span id="score">0</span><br>
        وضعیت: <span id="status">در حال بقا (زامبی‌ها نزدیکند!)</span>
    </div>

    <div id="crosshair">+</div>

    <!-- دکمه‌های لمسی حرکت -->
    <div class="controls">
        <div></div>
        <button class="btn" onclick="move('forward')">⬆️</button>
        <div></div>
        <button class="btn" onclick="move('left')">⬅️</button>
        <button class="btn" onclick="move('backward')">⬇️</button>
        <button class="btn" onclick="move('right')">➡️</button>
    </div>

    <!-- دکمه‌های پرش و کندن بلوک -->
    <div id="action-buttons">
        <button class="btn action-btn" onclick="jump()">پرش 🦘</button>
        <button class="btn action-btn" style="background: rgba(50, 150, 50, 0.8);" onclick="breakBlock()">کندن ⛏️</button>
    </div>

    <div id="canvas-container"></div>

    <!-- کتابخانه Three.js برای رندر گرافیک پیکسلی و بلوکی -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = [];
        let zombies = [];
        let score = 0;
        let playerVelocityY = 0;
        let isJumping = false;

        function init() {
            // ایجاد فضای سه‌بعدی
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // آسمان روشن
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

            // تنظیمات دوربین (دید بازیکن)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // رندر کننده گرافیکی
            renderer = new THREE.WebGLRenderer({ antialias: false }); // antialias غیرفعال برای حالت پیکسلی
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // نورپردازی محیط
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.5);
            sunLight.position.set(20, 40, 20);
            scene.add(sunLight);

            // ساخت زمین مستطیلی ماینکرفتی (چمن و خاک)
            createWorld();

            // ساخت زامبی‌های هوشمند پیکسلی
            for (let i = 0; i < 3; i++) {
                createZombie();
            }

            animate();
        }

        // ساخت زمین و بلوک‌های مکعبی
        function createWorld() {
            const blockSize = 2;
            const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            
            // متریال چمن (سبز)
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x559933 });
            // متریال خاک (قهوه‌ای)
            const dirtMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

            // لایه‌ی زمین
            for (let x = -10; x <= 10; x += 2) {
                for (let z = -20; z <= 5; z += 2) {
                    const block = new THREE.Mesh(geo, x % 4 === 0 ? grassMat : dirtMat);
                    block.position.set(x, 0, z);
                    scene.add(block);
                    blocks.push(block);
                }
            }
        }

        // ایجاد زامبی بلوکی
        function createZombie() {
            const zombieGeo = new THREE.BoxGeometry(1.5, 3, 1);
            const zombieMat = new THREE.MeshLambertMaterial({ color: 0x228833 }); // سبز تیره زامبی
            const zombie = new THREE.Mesh(zombieGeo, zombieMat);
            
            zombie.position.set(
                (Math.random() - 0.5) * 20,
                1.5,
                -15 - Math.random() * 15
            );
            
            scene.add(zombie);
            zombies.push(zombie);
        }

        // حرکت بازیکن با دکمه‌های لمسی یا کلیک
        function move(direction) {
            const speed = 1.0;
            if (direction === 'left') camera.position.x -= speed;
            if (direction === 'right') camera.position.x += speed;
            if (direction === 'forward') camera.position.z -= speed;
            if (direction === 'backward') camera.position.z += speed;
        }

        // قابلیت پرش پیکسلی
        function jump() {
            if (!isJumping) {
                isJumping = true;
                playerVelocityY = 0.4;
            }
        }

        // کندن بلوک روبه‌رو
        function breakBlock() {
            if (blocks.length > 0) {
                // آخرین بلوک جلوی بازیکن را حذف می‌کند
                const blockToRemove = blocks[Math.floor(Math.random() * blocks.length)];
                scene.remove(blockToRemove);
                blocks = blocks.filter(b => b !== blockToRemove);
                
                score += 1;
                document.getElementById('score').innerText = score;
            }
        }

        // لوپ اصلی بازی و هوش مصنوعی زامبی‌ها
        function animate() {
            requestAnimationFrame(animate);

            // مدیریت پرش و جاذبه
            if (isJumping) {
                camera.position.y += playerVelocityY;
                playerVelocityY -= 0.03; //شتاب جاذبه
                if (camera.position.y <= 5) {
                    camera.position.y = 5;
                    isJumping = false;
                }
            }

            // حرکت هوشمند زامبی‌ها به سمت دوربین بازیکن
            zombies.forEach(zombie => {
                if (zombie.position.z < camera.position.z) {
                    zombie.position.z += 0.04; // سرعت تعقیب زامبی
                } else {
                    zombie.position.z = -25; // اگر رد شد از پشت برمی‌گردد
                    zombie.position.x = (Math.random() - 0.5) * 20;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

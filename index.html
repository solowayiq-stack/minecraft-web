<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مینی ماینکرفت وب - با زامبی و کنترل لمسی</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Tahoma, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            z-index: 5;
        }
        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 10;
            text-align: right;
        }
        /* دکمه‌های کنترل لمسی روی صفحه */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 5px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn:active { background: rgba(255, 255, 255, 0.6); }
        
        .actions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 100, 100, 0.5);
            border: 2px solid white;
            color: white;
            font-size: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="ui">
        حرکت: دکمه‌های پایین چپ<br>
        پرش، کندن و ساختن: دکمه‌های راست
    </div>

    <!-- کنترل‌های لمسی -->
    <div class="controls">
        <div></div>
        <div class="btn" onclick="movePlayer(0, 1)">⬆️</div>
        <div></div>
        <div class="btn" onclick="movePlayer(-1, 0)">⬅️</div>
        <div class="btn" onclick="movePlayer(0, -1)">⬇️</div>
        <div class="btn" onclick="movePlayer(1, 0)">➡️</div>
    </div>

    <div class="actions">
        <div class="action-btn" onclick="jumpPlayer()">پرش</div>
        <div class="action-btn" style="background: rgba(100, 200, 100, 0.5);" onclick="actionBlock()">کندن/ساز</div>
    </div>

    <!-- کتابخانه سه‌بعدی Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // نورپردازی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // ساخت زمین (بلوک‌های چمن)
        const blockSize = 1;
        const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
        const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        
        const blocks = [];
        for (let x = -5; x <= 5; x++) {
            for (let z = -5; z <= 5; z++) {
                createBlock(x, 0, z, grassMaterial);
            }
        }

        function createBlock(x, y, z, mat) {
            const cube = new THREE.Mesh(geometry, mat);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
            return cube;
        }

        // موقعیت بازیکن
        let playerPos = { x: 0, y: 1.5, z: 5 };
        camera.position.set(playerPos.x, playerPos.y, playerPos.z);

        // افزودن زامبی
        const zombieGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const zombieMat = new THREE.MeshLambertMaterial({ color: 0x2E8B57 });
        const zombie = new THREE.Mesh(zombieGeo, zombieMat);
        zombie.position.set(3, 1, -3);
        scene.add(zombie);

        let zombiePos = { x: 3, z: -3 };

        // کنترل‌های حرکت با دکمه‌ها
        function movePlayer(dx, dz) {
            playerPos.x += dx * 0.5;
            playerPos.z += dz * 0.5;
            camera.position.x = playerPos.x;
            camera.position.z = playerPos.z;
        }

        function jumpPlayer() {
            playerPos.y += 1;
            camera.position.y = playerPos.y;
            setTimeout(() => {
                playerPos.y -= 1;
                camera.position.y = playerPos.y;
            }, 300);
        }

        // کندن یا ساختن بلوک روبرو
        function actionBlock() {
            let targetX = Math.round(playerPos.x);
            let targetZ = Math.round(playerPos.z - 1);
            
            // پیدا کردن بلوک جلو و حذف آن (کندن)
            let existingIndex = blocks.findIndex(b => Math.round(b.position.x) === targetX && Math.round(b.position.z) === targetZ && Math.round(b.position.y) === 0);
            
            if (existingIndex !== -1) {
                scene.remove(blocks[existingIndex]);
                blocks.splice(existingIndex, 1);
            } else {
                // اگر بلوکی نبود، یکی بساز
                createBlock(targetX, 0, targetZ, dirtMaterial);
            }
        }

        // حلقه اصلی بازی و حرکت زامبی به سمت بازیکن
        function animate() {
            requestAnimationFrame(animate);

            // تعقیب بازیکن توسط زامبی
            if (zombie.position.x < playerPos.x) zombie.position.x += 0.01;
            if (zombie.position.x > playerPos.x) zombie.position.x -= 0.01;
            if (zombie.position.z < playerPos.z) zombie.position.z += 0.01;
            if (zombie.position.z > playerPos.z) zombie.position.z -= 0.01;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
